name: Sync and publish registry

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'public/**'

permissions:
  contents: read

concurrency:
  group: registry-publisher
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install validator
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Fetch complete sources and validate
        run: |
          python -m registry sync
          python -m registry validate
      - name: Verify offline reproduction
        shell: bash
        run: |
          find public -type f -print0 | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/before.sha256"
          python -m registry build
          python -m registry validate
          find public -type f -print0 | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/after.sha256"
          diff -u "$RUNNER_TEMP/before.sha256" "$RUNNER_TEMP/after.sha256"
      - name: Store validated files for commit and smoke test
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: registry-public
          path: public/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Store Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: public/
          retention-days: 7

  commit:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: registry-public
          path: .publish
      - name: Replace only generated public files
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          source = Path('.publish')
          for name in ('catalog.json', 'models.json', 'providers.json', 'deployments.json'):
              assert (source / 'v1' / name).is_file(), f'Missing validated artifact: {name}'
          for item in source.rglob('*'):
              assert not item.is_symlink(), f'Unexpected symlink: {item}'
          if Path('public').exists():
              shutil.rmtree('public')
          shutil.copytree(source, 'public')
          PY
      - name: Commit only on matching main revision
        id: commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          remote_sha=$(git ls-remote origin refs/heads/main | cut -f1)
          if [[ "$remote_sha" != "$GITHUB_SHA" ]]; then
            echo '::error::main changed after this build. No files were pushed or deployed; rerun the workflow on current main.'
            exit 1
          fi
          git add -- public
          if git diff --cached --quiet; then
            echo 'Source data unchanged; retrying publication of the validated snapshot.'
          else
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'data: synchronize verified public sources'
            git -c credential.helper='!gh auth git-credential' push origin HEAD:refs/heads/main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  deploy:
    needs: [build, commit]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Confirm main still matches the committed snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EXPECTED_SHA: ${{ needs.commit.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          current_sha=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')
          if [[ "$current_sha" != "$EXPECTED_SHA" ]]; then
            echo '::error::main changed after the data commit. Publication stopped; rerun on current main.'
            exit 1
          fi
      - name: Publish the validated artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  smoke:
    needs: [build, commit, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: registry-public
          path: .published
      - name: Verify public JSON bytes and HTTP behavior
        env:
          PAGE_URL: ${{ needs.deploy.outputs.url }}
        run: python scripts/smoke.py --base "${PAGE_URL%/}/v1" --directory .published/v1 --attempts 8 --retry-delay 10
