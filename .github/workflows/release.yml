name: Release immutable data snapshot

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: registry-data-release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.package.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - run: python -m registry validate
      - name: Package validated snapshot
        id: package
        run: python scripts/release.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: registry-release
          path: release/
          if-no-files-found: error
          retention-days: 7

  release:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: registry-release
          path: release
      - name: Create once without replacing an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DATA_TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DATA_TAG" =~ ^data-[0-9a-f]{16}$ ]]
          (cd release && sha256sum --check SHA256SUMS)
          if gh release view "$DATA_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "Release $DATA_TAG already exists; leaving it unchanged."
          else
            gh release create "$DATA_TAG" "release/$DATA_TAG.zip" release/SHA256SUMS --repo "$GH_REPO" --target "$GITHUB_SHA" --title "$DATA_TAG" --notes-file release/notes.md
          fi
